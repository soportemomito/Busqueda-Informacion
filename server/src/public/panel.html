<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Info</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; background: #f0f2f5; color: #1a1a2e; max-width: 340px; min-height: 100vh; }

/* ── Header ─────────────────────────────────────────────────────────── */
.header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  color: #fff;
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
.header h1 {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #e8e8ff;
}
.header-btns { display: flex; gap: 6px; }
.btn-icon {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  color: #e8e8ff;
  padding: 4px 10px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  transition: background 0.15s, border-color 0.15s;
}
.btn-icon:hover { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.3); }
.btn-icon:disabled { opacity: 0.5; cursor: default; }

/* ── Status bar ──────────────────────────────────────────────────────── */
.status-bar {
  background: #eef0f6;
  border-bottom: 1px solid #dde0ea;
  padding: 5px 12px;
  font-size: 10px;
  color: #777;
  min-height: 24px;
  letter-spacing: 0.2px;
}

/* ── Manual search ───────────────────────────────────────────────────── */
.manual-bar {
  background: #fff;
  border-bottom: 1px solid #e0e3ec;
  padding: 8px 10px;
}
.btn-manual {
  background: none;
  border: 1px solid #1a1a2e;
  color: #1a1a2e;
  padding: 4px 11px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  transition: background 0.15s;
}
.btn-manual:hover { background: #f0f0f8; }
.manual-row { display: none; margin-top: 7px; gap: 5px; }
.manual-row.open { display: flex; }
.manual-row input {
  flex: 1;
  border: 1px solid #ccc;
  border-radius: 5px;
  padding: 5px 8px;
  font-size: 12px;
  outline: none;
  transition: border-color 0.15s;
}
.manual-row input:focus { border-color: #1a1a2e; }
.btn-search {
  background: #1a1a2e;
  color: #fff;
  border: none;
  padding: 5px 12px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: background 0.15s;
}
.btn-search:hover { background: #2e2e5e; }

/* ── Spinner ─────────────────────────────────────────────────────────── */
.spinner-wrap { display: flex; justify-content: center; padding: 36px; }
.spinner {
  width: 24px; height: 24px;
  border: 3px solid #dde0ea;
  border-top-color: #1a1a2e;
  border-radius: 50%;
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.sk { height: 9px; background: #dde; border-radius: 3px; margin: 8px 0; animation: pulse 1.4s ease-in-out infinite; }
.sk.w70{width:70%} .sk.w50{width:50%} .sk.w85{width:85%}
.skeleton { padding: 12px 12px 0; }

/* ── Duplicate alert ─────────────────────────────────────────────────── */
.dup-banner {
  margin: 8px;
  background: #fff5f5;
  border: 1px solid #f5b8b8;
  border-radius: 8px;
  padding: 10px 12px;
}
.dup-banner h3 { color: #a10000; font-size: 11px; font-weight: 700; margin-bottom: 6px; }
.dup-pair { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin: 5px 0; font-size: 11px; color: #444; }
.dup-info { line-height: 1.5; }
.btn-merge {
  background: #c82333; color: #fff; border: none;
  padding: 3px 9px; border-radius: 5px;
  cursor: pointer; font-size: 11px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
}
.btn-merge:hover { background: #a71d2a; }
.btn-merge:disabled { background: #999; cursor: default; }

/* ── Section ─────────────────────────────────────────────────────────── */
.section {
  background: #fff;
  margin: 8px;
  border-radius: 8px;
  border: 1px solid #e0e3ec;
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(26,26,46,0.06);
}
.sec-header {
  background: #f5f6fb;
  border-bottom: 1px solid #e0e3ec;
  padding: 6px 12px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .7px;
  color: #555;
  display: flex;
  align-items: center;
  gap: 4px;
}
.sec-icon { font-size: 12px; opacity: 0.7; }
.sec-count { font-weight: 500; color: #aaa; margin-left: 2px; font-size: 9px; text-transform: none; letter-spacing: 0; }
.sec-body { padding: 0; }

/* ── Contact card ────────────────────────────────────────────────────── */
.contact-card { padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
.c-row { display: flex; gap: 6px; align-items: baseline; }
.c-label { color: #888; font-size: 10px; min-width: 56px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
.c-val { font-size: 12px; color: #1a1a2e; word-break: break-all; font-weight: 500; }

/* ── Table ───────────────────────────────────────────────────────────── */
table { width: 100%; border-collapse: collapse; }
thead tr { background: #f9fafb; }
th {
  padding: 6px 10px;
  text-align: left;
  font-weight: 700;
  color: #777;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .4px;
  border-bottom: 1px solid #e8eaf0;
}
td {
  padding: 6px 10px;
  border-bottom: 1px solid #f0f2f7;
  font-size: 11px;
  color: #333;
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #f7f8fc; }

/* ── No-data ─────────────────────────────────────────────────────────── */
.no-data { padding: 10px 12px; font-size: 11px; color: #bbb; font-style: italic; }

/* ── Badges ──────────────────────────────────────────────────────────── */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .2px;
}
.b-open           { background: #d1f0da; color: #145c2a; }
.b-resolved       { background: #e9eaed; color: #4a4a5a; }
.b-pending        { background: #fff0c2; color: #7d5500; }
.b-paid           { background: #d1f0da; color: #145c2a; }
.b-pending_payment{ background: #ffe6cc; color: #7d3800; }
.b-refunded       { background: #fdd8da; color: #71181e; }
.b-default        { background: #eaebed; color: #555; }

/* ── Action buttons ──────────────────────────────────────────────────── */
.btn-link {
  display: inline-block;
  padding: 3px 9px;
  background: #1a1a2e;
  color: #fff;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  text-decoration: none;
  white-space: nowrap;
  transition: background 0.15s;
}
.btn-link:hover { background: #2e2e5e; }
.btn-copy {
  background: none;
  border: 1px solid #d0d3dc;
  color: #777;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 10px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.btn-copy:hover { border-color: #1a1a2e; color: #1a1a2e; }
</style>
</head>
<body>

<div class="header">
  <h1>Search Info</h1>
  <div class="header-btns">
    <button class="btn-icon" onclick="refresh()" title="Actualizar">↻ Refresh</button>
    <button class="btn-icon" id="btnSync" onclick="syncST()" title="Sincronizar órdenes de ST desde Google Sheets">⟳ ST</button>
  </div>
</div>

<div class="status-bar" id="statusBar">Esperando conversación de Chatwoot…</div>
<div class="manual-bar">
  <button class="btn-manual" onclick="toggleManual()">Buscar manualmente</button>
  <div class="manual-row" id="manualRow">
    <input type="text" id="manualInput" placeholder="Email, teléfono, nombre, SM1234, OS-56…" onkeydown="if(event.key==='Enter')doManualSearch()">
    <button class="btn-search" onclick="doManualSearch()">Buscar</button>
  </div>
</div>

<div id="app">
  <div class="skeleton">
    <div class="sk w85"></div><div class="sk w50"></div><div class="sk w70"></div>
    <div class="sk w85"></div><div class="sk w50"></div>
  </div>
</div>

<script>
  var _params = {};
  var _loading = false;

  function toggleManual() {
    var row = document.getElementById('manualRow');
    var open = row.classList.toggle('open');
    if (open) document.getElementById('manualInput').focus();
  }

  function doManualSearch() {
    var q = (document.getElementById('manualInput').value || '').trim();
    if (!q) return;
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(q))  _params = { email: q };
    else if (/^SM\d+$/i.test(q))                _params = { shopify_order: q.toUpperCase() };
    else if (/^OS[-\s]?\d+$/i.test(q))          _params = { service_order: q };
    else if (/^\d{4,8}$/.test(q))               _params = { boleta: q };
    else if (/^\+?[\d\s\-()+]{7,}$/.test(q))    _params = { phone: q };
    else                                         _params = { name: q };
    load();
  }

  function refresh() {
    if (Object.keys(_params).length) load();
  }

  async function load() {
    if (_loading) return;
    _loading = true;
    setStatus('Cargando…');
    document.getElementById('app').innerHTML = '<div class="spinner-wrap"><div class="spinner"></div></div>';
    try {
      var qs = new URLSearchParams(_params).toString();
      var r = await fetch('/search?' + qs);
      var data = await r.json();
      setStatus(data.meta && data.meta.found ? 'Contacto encontrado' : 'No encontrado');
      render(data);
    } catch (e) {
      setStatus('Error al cargar datos');
      document.getElementById('app').innerHTML = '<div class="section"><div class="no-data">Error al cargar datos.</div></div>';
    } finally {
      _loading = false;
    }
  }

  function badge(val) {
    var map = { open:'b-open', resolved:'b-resolved', pending:'b-pending',
                paid:'b-paid', pending_payment:'b-pending_payment', refunded:'b-refunded' };
    var cls = map[(val||'').toLowerCase()] || 'b-default';
    return '<span class="badge '+cls+'">'+(val||'—')+'</span>';
  }

  function fmt(v) { return v != null && v !== '' ? v : '—'; }

  function fmtDate(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'2-digit'}); } catch { return iso; }
  }

  function fmtMoney(v) {
    if (v == null) return '—';
    try { return new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',minimumFractionDigits:0}).format(v); } catch { return v; }
  }

  function sec(icon, title, inner) {
    return '<div class="section"><div class="sec-header"><span class="sec-icon">'+icon+'</span> '+title+'</div><div class="sec-body">'+inner+'</div></div>';
  }

  function noData() { return '<div class="no-data">Sin datos</div>'; }

  function render(data) {
    var html = '';

    // Duplicates banner
    if (data.duplicate_signals && data.duplicate_signals.length) {
      html += '<div class="dup-banner"><h3>⚠ Duplicados detectados ('+data.duplicate_signals.length+')</h3>';
      data.duplicate_signals.forEach(function(s) {
        html += '<div class="dup-pair"><div class="dup-info"><strong>'+fmt(s.signal_type)+':</strong> '+fmt(s.signal_value)+'<br>Conv #'+s.conversation_id_a+' ↔ #'+s.conversation_id_b+'</div>'
          +'<button class="btn-merge" onclick="mergePair('+s.conversation_id_a+','+s.conversation_id_b+',this)">Fusionar</button></div>';
      });
      html += '</div>';
    }

    // Cliente
    if (data.contact) {
      var c = data.contact;
      html += sec('👤','Cliente','<div class="contact-card">'
        +'<div class="c-row"><span class="c-label">Nombre</span><span class="c-val">'+fmt(c.name)+'</span></div>'
        +'<div class="c-row"><span class="c-label">Email</span><span class="c-val">'+fmt(c.email)+'</span></div>'
        +'<div class="c-row"><span class="c-label">Teléfono</span><span class="c-val">'+fmt(c.phone)+'</span></div>'
        +'</div>');
    } else {
      html += sec('👤','Cliente', noData());
    }

    // Pedidos Shopify
    if (data.shopify_orders && data.shopify_orders.length) {
      var rows = data.shopify_orders.map(function(o) {
        var link = (typeof SHOPIFY_URL !== 'undefined' && SHOPIFY_URL && o.shopify_order_id)
          ? '<a class="btn-link" href="'+SHOPIFY_URL+'/admin/orders/'+o.shopify_order_id+'" target="_blank">Ver</a>'
          : '';
        return '<tr><td><strong>'+fmt(o.order_name)+'</strong></td><td>'+badge(o.financial_status)+'</td><td>'+fmtMoney(o.total_price)+'</td><td>'+link+'</td></tr>';
      }).join('');
      html += sec('🛒','Pedidos Shopify <span class="sec-count">('+data.shopify_orders.length+')</span>','<table><thead><tr><th>Orden</th><th>Pago</th><th>Total</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>');
    } else {
      html += sec('🛒','Pedidos Shopify', noData());
    }

    // Boletas Bsale
    if (data.bsale_documents && data.bsale_documents.length) {
      var rows = data.bsale_documents.map(function(d) {
        var href = d.bsale_public_url
          || ((typeof BSALE_URL !== 'undefined' && BSALE_URL && d.bsale_doc_id)
              ? BSALE_URL+'/ventas/documentos/'+d.bsale_doc_id : '');
        var link = href ? '<a class="btn-link" href="'+href+'" target="_blank">Ver</a>' : '';
        return '<tr><td><strong>'+fmt(d.document_number)+'</strong></td><td>'+fmt(d.document_type)+'</td><td>'+fmtMoney(d.total_amount)+'</td><td>'+link+'</td></tr>';
      }).join('');
      html += sec('🧾','Boletas Bsale <span class="sec-count">('+data.bsale_documents.length+')</span>','<table><thead><tr><th>N°</th><th>Tipo</th><th>Total</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>');
    } else {
      html += sec('🧾','Boletas Bsale', noData());
    }

    // Órdenes de Servicio
    if (data.service_orders && data.service_orders.length) {
      var rows = data.service_orders.map(function(o) {
        var informe = o.report_url
          ? '<a class="btn-link" href="'+o.report_url+'" target="_blank">Informe</a>'
          : '';
        return '<tr><td><strong>'+fmt(o.order_number)+'</strong></td><td>'+badge(o.status)+'</td><td>'+fmtDate(o.received_at)+'</td><td>'+informe+'</td></tr>';
      }).join('');
      html += sec('🔧','Órdenes de Servicio <span class="sec-count">('+data.service_orders.length+')</span>','<table><thead><tr><th>N°</th><th>Estado</th><th>Fecha</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>');
    } else {
      html += sec('🔧','Órdenes de Servicio', noData());
    }

    // Conversaciones
    if (data.conversations && data.conversations.length) {
      var rows = data.conversations.map(function(c) {
        var link = (typeof CW_URL !== 'undefined' && CW_URL && typeof CW_ACCOUNT !== 'undefined' && CW_ACCOUNT)
          ? '<a class="btn-link" href="'+CW_URL+'/app/accounts/'+CW_ACCOUNT+'/conversations/'+c.chatwoot_conversation_id+'" target="_blank">Abrir</a>'
          : '#'+fmt(c.chatwoot_conversation_id);
        return '<tr><td>'+fmt(c.channel_type)+'</td><td>'+badge(c.status)+'</td><td>'+fmtDate(c.chatwoot_created_at)+'</td><td>'+link+'</td></tr>';
      }).join('');
      html += sec('💬','Conversaciones <span class="sec-count">('+data.conversations.length+')</span>','<table><thead><tr><th>Canal</th><th>Estado</th><th>Fecha</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>');
    } else {
      html += sec('💬','Conversaciones', noData());
    }

    // Dispositivos
    if (data.devices && data.devices.length) {
      var rows = data.devices.map(function(d) {
        var copyImei = d.imei ? '<button class="btn-copy" onclick="copyText(\''+d.imei+'\',this)">Copiar</button>' : '';
        return '<tr><td>'+fmt(d.imei)+' '+copyImei+'</td><td>'+fmt(d.sim_id)+'</td><td>'+fmt(d.brand)+' '+fmt(d.model)+'</td></tr>';
      }).join('');
      html += sec('📱','Dispositivos <span class="sec-count">('+data.devices.length+')</span>','<table><thead><tr><th>IMEI</th><th>SIM</th><th>Equipo</th></tr></thead><tbody>'+rows+'</tbody></table>');
    }

    document.getElementById('app').innerHTML = html;
  }

  async function mergePair(convA, convB, btn) {
    btn.disabled = true;
    btn.textContent = 'Fusionando…';
    try {
      var r = await fetch('/merge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ base_conversation_id: convA, mergee_conversation_id: convB, triggered_by: 'panel' })
      });
      var data = await r.json();
      if (data.success) {
        btn.textContent = '✓ Fusionado';
        setTimeout(load, 1200);
      } else {
        btn.textContent = 'Error';
        btn.disabled = false;
      }
    } catch {
      btn.textContent = 'Error';
      btn.disabled = false;
    }
  }

  async function syncST() {
    var btn = document.getElementById('btnSync');
    btn.textContent = '⟳ Sync…';
    btn.disabled = true;
    try {
      var r = await fetch('/sync/service-orders', { method: 'POST' });
      var d = await r.json();
      btn.textContent = d.success ? ('✓ ' + d.synced + ' OS') : '✗ Error';
      setTimeout(function() { btn.textContent = '⟳ ST'; btn.disabled = false; }, 3000);
      if (d.success && d.synced > 0 && Object.keys(_params).length) load();
    } catch {
      btn.textContent = '✗ Error';
      setTimeout(function() { btn.textContent = '⟳ ST'; btn.disabled = false; }, 3000);
    }
  }

  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(function() {
      var orig = btn.textContent;
      btn.textContent = '✓';
      setTimeout(function() { btn.textContent = orig; }, 1500);
    }).catch(function() {});
  }

  function setStatus(msg) {
    var el = document.getElementById('statusBar');
    if (el) el.textContent = msg;
  }

  // Chatwoot postMessage integration
  window.addEventListener('message', function(event) {
    try {
      var raw = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      if (!raw || typeof raw !== 'object') return;

      var data = (raw.event === 'appContext' && raw.data) ? raw.data : raw;

      var sender = {};
      var convId = null;

      if (data.conversation && data.conversation.meta && data.conversation.meta.sender) {
        sender = data.conversation.meta.sender;
        convId = data.conversation.id;
      } else if (data.meta && data.meta.sender) {
        sender = data.meta.sender;
        convId = data.id;
      } else if (data.contact) {
        sender = data.contact;
        convId = data.id;
      } else { return; }

      var p = {};
      if (convId)              p.conversation_id = convId;
      if (sender.email)        p.email = sender.email;
      if (sender.phone_number) p.phone = sender.phone_number;
      if (sender.name && !p.email && !p.phone) p.name = sender.name;

      if (!Object.keys(p).length) return;

      _loading = false;
      setStatus('Buscando: ' + (p.email || p.phone || p.name || 'conv #' + p.conversation_id));
      _params = p;
      load();
    } catch (_) {}
  });
</script>
</body>
</html>
